# Share-Sync-1 · 25 Sep 2026 — independent backstop to bin/githooks/pre-push.
# A local hook can be skipped (--no-verify, fresh clone, another machine). This cannot.
# Red here = refueler.io's committed mirror does not match refueler-share main.
# Fix: /Users/rajeshtaylor/Documents/refueler-share/bin/ship-frontend.sh "msg"
#
# No live-site step here, deliberately: Cloudflare bot protection challenges GitHub's
# datacenter IPs on non-static paths (.wasm, .html), so a live check from CI reports
# false failures. Live byte-proof runs from Rajesh's Mac inside ship-frontend.sh, and
# on demand via: bin/sync-share.sh --live
name: Mirror — refueler.io/share/ serves canonical frontend

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'   # catches direct edits pushed to the refueler.io mirror
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout refueler-share (canonical)
        uses: actions/checkout@v4

      - name: Checkout refueler-io (mirror, public)
        uses: actions/checkout@v4
        with:
          repository: rajesh-taylor/refueler-io
          ref: main
          path: _io

      - name: Committed mirror matches canonical
        env:
          REFUELER_IO_ROOT: ${{ github.workspace }}/_io
        run: bin/sync-share.sh --check
