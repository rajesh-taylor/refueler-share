name: CI — Level 1

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Build · Lint · Test · Dry-run deploy
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── Node 20 ─────────────────────────────────────────────────────────
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json

      # ── Install root deps (Eleventy) ─────────────────────────────────────
      - name: Install root dependencies
        run: npm ci

      # ── Eleventy build check ─────────────────────────────────────────────
      - name: Eleventy build
        run: npm run build

      # ── Install Worker deps ──────────────────────────────────────────────
      - name: Install Worker dependencies
        working-directory: worker
        run: npm ci

      # ── ESLint — worker/src/ only ────────────────────────────────────────
      - name: Lint worker/src/
        working-directory: worker
        run: npx eslint src/

      # ── Unit tests ───────────────────────────────────────────────────────
      - name: Unit tests
        working-directory: worker
        run: npm test

      # ── Wrangler dry-run deploy ──────────────────────────────────────────
      # Requires CF_API_TOKEN secret set in GitHub repo Settings → Secrets.
      # The token needs Workers:Edit permission on the refueler.io account.
      # Set it at: https://github.com/rajesh-taylor/refueler-share/settings/secrets/actions
      # Token name: CF_API_TOKEN
      - name: Wrangler dry-run deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: npx wrangler deploy --dry-run
