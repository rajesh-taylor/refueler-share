name: CI — Level 1

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: Build · Lint · Test · Dry-run deploy
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ── Node 20 ─────────────────────────────────────────────────────────
      - name: Set up Node 20
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json

      # ── Install root deps (Eleventy) ─────────────────────────────────────
      # H4 Supply-Chain-1: no package's install script runs (esbuild and workerd ship their
      # binaries as optional packages, so nothing needs one), then every package's registry
      # signature is checked against the lock file.
      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: Registry signatures (root)
        run: npm audit signatures

      # ── Eleventy build check (the app's HTML, eleventy.app.js) ──────────
      - name: Eleventy build
        run: npm run build

      # ── Install Worker deps ──────────────────────────────────────────────
      - name: Install Worker dependencies
        working-directory: worker
        run: npm ci --ignore-scripts

      - name: Registry signatures (Worker)
        working-directory: worker
        run: npm audit signatures

      # ── Vulnerability scan (Vuln-Watch-1) ────────────────────────────────
      # Blocks on high/critical advisories in what the Worker ships (prod deps).
      # Dev tools (wrangler, vitest…) are listed but never block: they don't ship,
      # and Dependabot's weekly PRs move them. Open findings → refueler-share-private.
      - name: Audit Worker production dependencies (blocks on high/critical)
        working-directory: worker
        run: npm audit --omit=dev --audit-level=high

      - name: Audit dev tools (report only)
        working-directory: worker
        run: npm audit --audit-level=high || echo "::warning::dev-tool advisories above (report only)"

      # Vendored browser + Worker bundles: hashes still match frontend/VENDORED.md,
      # and OSV has no high/critical advisory for each name + version.
      - name: Vendored code — hashes + OSV
        run: node bin/check-vendored.mjs

      # Every Worker route has a row in docs/ROUTES.md (and every row a route).
      - name: Route inventory
        run: node bin/route-inventory.mjs --check

      # UUID-Out-Of-Path-1: no transfer UUID in an API path (app, Worker, scripts).
      - name: No transfer UUID in a path
        run: node bin/check-no-uuid-path.mjs

      # ── ESLint — worker/src/ only ────────────────────────────────────────
      - name: Lint worker/src/
        working-directory: worker
        run: npx eslint src/

      # ── Unit tests ───────────────────────────────────────────────────────
      - name: Unit tests
        working-directory: worker
        run: npm test

      # ── Wrangler dry-run deploy ──────────────────────────────────────────
      # Bundles locally; needs no Cloudflare token (F5, removed 24 Oct 2026).
      - name: Wrangler dry-run deploy
        working-directory: worker
        run: npx wrangler deploy --dry-run
