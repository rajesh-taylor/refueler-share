name: CI — Level 1

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Build · Lint · Test · Dry-run deploy
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ── Node 20 ─────────────────────────────────────────────────────────
      - name: Set up Node 20
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json

      # ── Install root deps (Eleventy) ─────────────────────────────────────
      - name: Install root dependencies
        run: npm ci

      # ── Eleventy build check (the app's HTML, eleventy.app.js) ──────────
      - name: Eleventy build
        run: npm run build

      # ── Install Worker deps ──────────────────────────────────────────────
      - name: Install Worker dependencies
        working-directory: worker
        run: npm ci

      # ── Vulnerability scan (Vuln-Watch-1) ────────────────────────────────
      # Blocks on high/critical advisories in what the Worker ships (prod deps).
      # Dev tools (wrangler, vitest…) are listed but never block: they don't ship,
      # and Dependabot's weekly PRs move them. Open findings → refueler-share-private.
      - name: Audit Worker production dependencies (blocks on high/critical)
        working-directory: worker
        run: npm audit --omit=dev --audit-level=high

      - name: Audit dev tools (report only)
        working-directory: worker
        run: npm audit --audit-level=high || echo "::warning::dev-tool advisories above (report only)"

      # Vendored browser + Worker bundles: hashes still match frontend/VENDORED.md,
      # and OSV has no high/critical advisory for each name + version.
      - name: Vendored code — hashes + OSV
        run: node bin/check-vendored.mjs

      # Every Worker route has a row in docs/ROUTES.md (and every row a route).
      - name: Route inventory
        run: node bin/route-inventory.mjs --check

      # ── ESLint — worker/src/ only ────────────────────────────────────────
      - name: Lint worker/src/
        working-directory: worker
        run: npx eslint src/

      # ── Unit tests ───────────────────────────────────────────────────────
      - name: Unit tests
        working-directory: worker
        run: npm test

      # ── Wrangler dry-run deploy ──────────────────────────────────────────
      # Requires CF_API_TOKEN secret set in GitHub repo Settings → Secrets.
      # The token needs Workers:Edit permission on the refueler.io account.
      # Set it at: https://github.com/rajesh-taylor/refueler-share/settings/secrets/actions
      # Token name: CF_API_TOKEN
      - name: Wrangler dry-run deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: npx wrangler deploy --dry-run
