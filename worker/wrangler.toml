name = "refueler-share"
main = "src/index.js"
compatibility_date = "2025-01-15"
compatibility_flags = ["nodejs_compat"]

[limits]
cpu_ms = 300000

# R2 bucket binding
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "refueler-share-prod"
preview_bucket_name = "refueler-share-dev"

# Secrets (set via `wrangler secret put <NAME>`)
# MINT_PRIVATE_KEY     — secp256k1 private key hex (32 bytes). Never logged. Never exposed.
# TURNSTILE_SECRET_KEY — Cloudflare Turnstile secret key
# SUPABASE_URL         — https://<project>.supabase.co
# SUPABASE_SERVICE_KEY — service_role JWT (spent_tokens write)
# R2_S3_ACCESS_KEY_ID     — R2 API token Access Key ID  (Share-6-1, presigning). Worker secret only.
# R2_S3_SECRET_ACCESS_KEY — R2 API token Secret Access Key (Share-6-1, presigning). Worker secret only — never KV, never a URL.
# BLINK_API_KEY        — Blink Share account API key (READ + RECEIVE scopes)
# BLINK_WALLET_ID      — Blink Share account GBP wallet ID

[vars]
ENVIRONMENT = "production"
LIGHTNING_BACKEND = "lnbits"
# Share-6-1: bucket the Worker presigns PutObject against (direct-to-R2 path).
# The R2 Workers binding above (BUCKET) is unaffected. For the dev smoke test,
# set this to refueler-share-dev; the /admin/r2-presign-test endpoint always
# forces the dev bucket regardless of this value.
R2_BUCKET_NAME = "refueler-share-prod"
BLINK_WALLET_ID            = ""
BLINK_API_KEY              = ""
PRICE_CREATIVE_MONTHLY_GBP = "12"
PRICE_CREATIVE_YEARLY_GBP  = "144"
PRICE_MAX_MONTHLY_GBP      = "24"
PRICE_MAX_YEARLY_GBP       = "288"

# R2 lifecycle rules are applied via Wrangler CLI — see docs/r2-lifecycle.md
# Rule 1: AbortIncompleteMultipartUpload — 24h (entire bucket)
# Rule 2: Expiration backstop — 92 days (90-day Production Max max + 2-day buffer)

[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]
fallthrough = false

[[kv_namespaces]]
binding = "STATUS_KV"
id      = "5b1dca6a8f06423f98d0bbc4286e2968"

# Analytics Engine — instrumentation dataset
# Dataset created automatically on first write
[[analytics_engine_datasets]]
binding  = "AE"
dataset  = "share_events"

# SW4b: daily dead-letter webhook retry — 03:00 UTC
[triggers]
crons = ["0 3 * * *"]

# SW1: custom hostname routing — api.share.refueler.io → this Worker
[[routes]]
pattern = "api.share.refueler.io/*"
zone_name = "refueler.io"