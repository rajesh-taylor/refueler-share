name = "refueler-share"
main = "src/index.js"
compatibility_date = "2025-01-15"
compatibility_flags = ["nodejs_compat"]
# H6a (30 Oct 2026): no workers.dev or preview hostname — each would be a door to the
# admin routes without Cloudflare Access. Pinned here so a deploy can't turn them back on.
workers_dev  = false
preview_urls = false

# H6a Admin-Access-1b (31 Oct 2026): Navy Office (../navy-office/) as static assets.
# run_worker_first = true: every request reaches the Worker first, which serves these files
# only on ADMIN_HOST, after the Access check (src/admin_host.js); without it they would be
# public on api.share too. navy-office/.assetsignore lets only the page's own files through.
[assets]
directory = "../navy-office"
binding = "ASSETS"
run_worker_first = true

[limits]
cpu_ms = 300000

# H1 (18 Oct 2026): Workers Logs and traces stay OFF — no request log, so no IP is kept
# by us. Pinned here so a deploy cannot turn them on; worker/test/h1-headers.test.js
# fails if this block is removed or enabled.
[observability]
enabled = false

[observability.logs]
enabled = false

[observability.traces]
enabled = false

# R2 bucket binding
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "refueler-share-prod"
preview_bucket_name = "refueler-share-dev"

# Secrets (set via `wrangler secret put <NAME>`)
# MINT_PRIVATE_KEY     — secp256k1 private key hex (32 bytes). Never logged. Never exposed.
# TURNSTILE_SECRET_KEY — Cloudflare Turnstile secret key (app widget, share.refueler.io)
# TURNSTILE_PLANS_SECRET_KEY — Plans widget secret (Plans-Stripe-1; checkout only)
# SUPABASE_URL         — https://<project>.supabase.co
# SUPABASE_SERVICE_KEY — service_role JWT (spent_tokens write)
# R2_S3_ACCESS_KEY_ID     — R2 API token Access Key ID  (Share-6-1, presigning). Worker secret only.
# R2_S3_SECRET_ACCESS_KEY — R2 API token Secret Access Key (Share-6-1, presigning). Worker secret only — never KV, never a URL.

[vars]
ENVIRONMENT = "production"
# Share-6-1: bucket the Worker presigns PutObject against (direct-to-R2 path).
# The R2 Workers binding above (BUCKET) is unaffected. For the dev smoke test,
# set this to refueler-share-dev; the /admin/r2-presign-test endpoint always
# forces the dev bucket regardless of this value.
R2_BUCKET_NAME = "refueler-share-prod"
R2_BUDGET_GIB  = "500"   # B12-2: Navy Office occupancy budget (display only)
# Sealing key generation (B12-SR S3): secret SHARE_SEAL_KEY_<n>, n = this value.
# Rotate by adding SHARE_SEAL_KEY_2 and flipping this to "2" (src/seal.js).
SHARE_SEAL_CURRENT         = "1"
# B12-4a sign-in (B12-SR S6). AUTH_ORIGINS = exact origins allowed credentialed
# calls (comma-separated, https only, never localhost). Secret AUTH_PEPPER set via
# wrangler secret. X5-2b (16 Oct 2026): sign-in lives only on share.refueler.io.
# APP_ORIGINS = page origins the public CORS (corsHeaders, auth_ping) echoes; the
# first entry answers unknown origins. refueler.io stays: Plans + Status (/status)
# and Navy Office (/admin/*) still run there until they move (Plans-Design-Opus).
AUTH_API_HOST              = "api.share.refueler.io"
AUTH_ORIGINS               = "https://share.refueler.io"
APP_ORIGINS                = "https://share.refueler.io,https://refueler.io"
AUTH_SIGNIN_URL            = "https://share.refueler.io/signin/"
AUTH_MAIL_FROM             = "signin@mail.refueler.io"
# Ops-Alerts-1 (src/ops.js): the hourly check's alert emails. The recipient is the secret
# OPS_ALERT_TO (wrangler secret put), so the address stays out of this public repo.
OPS_MAIL_FROM              = "alerts@mail.refueler.io"
# Plans-Stripe-1: the page host a checkout Turnstile token must come from.
# Becomes "pay.refueler.io" when Plans moves (Plans-Design-Opus).
PLANS_TURNSTILE_HOSTNAME   = "refueler.io"
# H6a admin host (src/admin_host.js, src/access_jwt.js). Admin paths answer only on
# ADMIN_HOST, behind Cloudflare Access app "Share admin" (team + AUD tag: not secrets).
# ADMIN_PUBLIC_UNTIL (unix seconds): while in the future, api.share also answers admin
# paths as before. Cut-over (Admin-Access-1b, 31 Oct): now + 24 h = 1793545200 =
# Sun 1 Nov 2026 15:00 UTC; it shuts itself then. Break-glass if Access is down: now + 2 h,
# deploy, commit message starting "break-glass:". "0" = shut.
ADMIN_HOST                 = "admin.share.refueler.io"
ACCESS_TEAM                = "refueler"
ACCESS_AUD                 = "80791e08c0e4393cd50e014a4c44c421fa09e2293cc2e7138973367ab3b05a0a"
ADMIN_PUBLIC_UNTIL         = "1793545200"

# R2 lifecycle rules are applied via Wrangler CLI — see docs/r2-lifecycle.md
# Rule 1: AbortIncompleteMultipartUpload — 24h (entire bucket)
# Rule 2: Expiration backstop — 92 days (90-day Production Max max + 2-day buffer)

[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]
fallthrough = false

# B12-4a: Cloudflare Email Sending (beta) — sign-in links (src/mailer.js) and, since
# Ops-Alerts-1, ops alerts to Rajesh (src/ops.js). Nothing else.
[[send_email]]
name = "EMAIL"

[[kv_namespaces]]
binding = "STATUS_KV"
id      = "5b1dca6a8f06423f98d0bbc4286e2968"

# Analytics Engine — instrumentation dataset
# Dataset created automatically on first write
[[analytics_engine_datasets]]
binding  = "AE"
dataset  = "share_events"

# SW4b: daily dead-letter webhook retry — 03:00 UTC
[triggers]
crons = ["0 3 * * *", "30 3 * * *", "15 * * * *"]  # 03:30 = nightly_sweep.js; :15 hourly = sign-in sweep (Tombstone-30) + ops check (Ops-Alerts-1)

# SW1: custom hostname routing — api.share.refueler.io → this Worker
[[routes]]
pattern = "api.share.refueler.io/*"
zone_name = "refueler.io"

# H6a: admin host as a Workers Custom Domain — creates the DNS record and an Advanced
# Certificate (Universal SSL doesn't cover a second-level subdomain). Access app
# "Share admin" stands in front of the whole hostname. Never the Worker-level Access
# toggle: it would put Access in front of api.share too.
[[routes]]
pattern = "admin.share.refueler.io"
custom_domain = true