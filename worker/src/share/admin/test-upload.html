<!DOCTYPE html>
<!--
  worker/src/share/admin/test-upload.html  (Share-Admin-2)

  Hidden admin soak-test page.
  - NEVER add to bin/sync-share.sh
  - NEVER commit to the public mirror
  - Served ONLY from refueler.io/share/admin/test-upload.html (internal path)

  Purpose: drive large dummy uploads through the full direct-to-R2 pipeline
  (credential/issue → /upload/:uuid/initiate → /urls → presigned PUTs → /finalise)
  so listBasedCompleteness and the WASM BLAKE3 download-verify path can be
  validated end-to-end at scale.

  Share-Admin-1: sequential, 5 GiB / 160 chunks (passed 5/5).
  Share-Admin-2: parallel upload pool + download-verify phase; target 250 GiB /
  8,000 chunks to validate listBasedCompleteness pagination (8 list() calls) and
  WASM BLAKE3 under sustained load.

  Admin key is entered in the form — never hard-coded, never logged, never sent
  to any endpoint except the Worker.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Share Admin · Soak Upload</title>
<style>
  :root {
    --bg:      #1A1A1A;
    --surface: #242424;
    --border:  #333333;
    --text:    #F5F0E8;
    --muted:   #888880;
    --accent:  #C8A96E;
    --green:   #4CAF6E;
    --red:     #CF6679;
    --warn:    #E8A040;
    --mono:    'JetBrains Mono', 'Fira Mono', 'Courier New', monospace;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 14px;
    line-height: 1.5;
    min-height: 100vh;
    padding: 32px 16px;
  }
  h1 { font-size: 18px; font-weight: 600; color: var(--accent); margin-bottom: 4px; }
  .sub { color: var(--muted); font-size: 12px; margin-bottom: 24px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 16px;
    max-width: 700px;
  }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  input[type=text], input[type=number], input[type=password] {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    padding: 8px 10px;
    margin-bottom: 12px;
    outline: none;
  }
  input:focus { border-color: var(--accent); }
  .row { display: flex; gap: 12px; }
  .row > * { flex: 1; }
  button {
    background: var(--accent);
    border: none;
    border-radius: 4px;
    color: #1A1A1A;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    padding: 8px 20px;
    margin-right: 8px;
  }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button.secondary {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
  }
  .log {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    font-family: var(--mono);
    font-size: 12px;
    height: 440px;
    overflow-y: auto;
    padding: 10px;
    white-space: pre-wrap;
    word-break: break-all;
    margin-top: 16px;
  }
  .log .ok   { color: var(--green); }
  .log .err  { color: var(--red); }
  .log .warn { color: var(--warn); }
  .log .info { color: var(--muted); }
  .log .head { color: var(--accent); }
  progress {
    width: 100%;
    height: 8px;
    margin-top: 12px;
    border-radius: 4px;
    appearance: none;
    background: var(--border);
  }
  progress::-webkit-progress-bar   { background: var(--border); border-radius: 4px; }
  progress::-webkit-progress-value { background: var(--accent);  border-radius: 4px; }
  .stat-row { display: flex; gap: 16px; margin-top: 12px; flex-wrap: wrap; }
  .stat { font-size: 11px; color: var(--muted); }
  .stat span { display: block; font-size: 15px; font-weight: 600; color: var(--text); font-family: var(--mono); }
</style>
</head>
<body>

<h1>Share Admin · Soak Upload</h1>
<p class="sub">
  Drives a large dummy upload through the full direct-to-R2 pipeline.<br>
  Share-Admin-2: parallel upload pool + WASM BLAKE3 download-verify phase.<br>
  INTERNAL ONLY — never linked from any public page.
</p>

<div class="card">
  <label>Worker base URL</label>
  <input type="text" id="workerUrl" value="https://api.share.refueler.io">

  <label>X-Admin-Key</label>
  <input type="password" id="adminKey" placeholder="Enter admin key">

  <div class="row">
    <div>
      <label>Target size (GiB)</label>
      <input type="number" id="targetGib" value="250" min="0.1" max="300" step="0.1">
    </div>
    <div>
      <label>Concurrency (parallel PUTs)</label>
      <input type="number" id="concurrency" value="8" min="1" max="32" step="1">
    </div>
  </div>

  <div class="row">
    <div>
      <label>Chunk size (MiB) — must match Worker = 32</label>
      <input type="number" id="chunkMib" value="32" min="1" max="32" step="1">
    </div>
    <div>
      <label>Credential cap (GiB)</label>
      <input type="number" id="capGib" value="260" min="1" max="300" step="1">
    </div>
  </div>

  <div class="row">
    <div>
      <label>Credential expiry (seconds)</label>
      <input type="number" id="credExpiry" value="28800" min="60" max="86400" step="60">
    </div>
    <div>
      <label>Download-verify chunks after upload (0 = skip)</label>
      <input type="number" id="verifyChunks" value="5" min="0" max="100" step="1">
    </div>
  </div>

  <div style="margin-top:4px;">
    <button id="btnStart">Start soak upload</button>
    <button id="btnAbort" class="secondary" disabled>Abort</button>
  </div>

  <progress id="prog" value="0" max="100"></progress>
  <div class="stat-row">
    <div class="stat">Chunks<span id="statChunks">—</span></div>
    <div class="stat">Uploaded<span id="statBytes">—</span></div>
    <div class="stat">Elapsed<span id="statElapsed">—</span></div>
    <div class="stat">Speed<span id="statSpeed">—</span></div>
    <div class="stat">ETA<span id="statEta">—</span></div>
    <div class="stat">Transfer UUID<span id="statUuid">—</span></div>
  </div>
</div>

<div class="card" style="max-width:700px;">
  <div id="log" class="log"><span class="info">Waiting for start…</span>
</div>
</div>

<script type="module">
// ─── Noble BLAKE3 (CDN — admin-only page, no CSP restriction) ────────────────
import { blake3 } from 'https://esm.sh/@noble/hashes@1.8.0/blake3';
import * as secp from 'https://esm.sh/@noble/secp256k1@2.2.1';

// ─── Utilities ────────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);

const log = $('log');
function emit(msg, cls = 'info') {
  const span = document.createElement('span');
  span.className = cls;
  span.textContent = msg + '\n';
  log.appendChild(span);
  log.scrollTop = log.scrollHeight;
}

function fmtBytes(b) {
  if (b < 1024) return `${b} B`;
  if (b < 1024**2) return `${(b/1024).toFixed(1)} KiB`;
  if (b < 1024**3) return `${(b/1024**2).toFixed(2)} MiB`;
  return `${(b/1024**3).toFixed(3)} GiB`;
}

function fmtSeconds(s) {
  if (s < 60) return `${s}s`;
  if (s < 3600) return `${Math.floor(s/60)}m ${s % 60}s`;
  return `${Math.floor(s/3600)}h ${Math.floor((s%3600)/60)}m`;
}

function toB64url(buf) {
  const bytes = buf instanceof Uint8Array ? buf : new Uint8Array(buf);
  let b = '';
  for (let i = 0; i < bytes.length; i++) b += String.fromCharCode(bytes[i]);
  return btoa(b).replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
}

function b64urlDecode(s) {
  const b64 = s.replace(/-/g, '+').replace(/_/g, '/');
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

// ─── Random chunk generator (respects 64 KiB getRandomValues cap) ────────────
function randomChunk(size) {
  const buf = new Uint8Array(size);
  for (let o = 0; o < buf.length; o += 65536)
    crypto.getRandomValues(buf.subarray(o, Math.min(o + 65536, buf.length)));
  return buf;
}

// ─── BDHKE blind (same as share.js) ──────────────────────────────────────────
async function blindedMessage() {
  const secret  = crypto.getRandomValues(new Uint8Array(32));
  const Y       = secp.ProjectivePoint.fromPrivateKey(secret);
  const rBytes  = crypto.getRandomValues(new Uint8Array(32));
  const r       = secp.utils.normPrivateKeyToScalar(rBytes);
  const B_      = Y.add(secp.ProjectivePoint.BASE.multiply(r));
  return { blinded_message: B_.toHex(true), r, secret };
}

// ─── Merkle tree (rfc6962-unbalanced-blake3-v1) ────────────────────────────────
// leaf  = 32-byte BLAKE3(chunk bytes)        — domain tag 0x00 applied by finalise.js
// node  = BLAKE3( 0x01 ‖ left(32) ‖ right(32) )
// odd leaf at any level propagates up unchanged
function merkleNode(left, right) {
  const buf = new Uint8Array(65);
  buf[0] = 0x01;
  buf.set(left,  1);
  buf.set(right, 33);
  return blake3(buf);
}

function buildMerkleRoot(leafHashBytes) {
  // leafHashBytes: Array of Uint8Array(32) in chunk order
  let nodes = leafHashBytes.slice();
  while (nodes.length > 1) {
    const next = [];
    for (let i = 0; i < nodes.length; i += 2) {
      next.push(i + 1 < nodes.length
        ? merkleNode(nodes[i], nodes[i + 1])
        : nodes[i]);
    }
    nodes = next;
  }
  return nodes[0];
}

// ─── State ────────────────────────────────────────────────────────────────────
let abortController = null;

// ─── Main ─────────────────────────────────────────────────────────────────────
$('btnStart').addEventListener('click', async () => {
  log.innerHTML = '';

  const workerUrl    = $('workerUrl').value.replace(/\/$/, '');
  const adminKey     = $('adminKey').value.trim();
  const targetGib    = parseFloat($('targetGib').value)   || 250;
  const concurrency  = parseInt($('concurrency').value, 10) || 8;
  const chunkMib     = parseInt($('chunkMib').value, 10)   || 32;
  const capGib       = parseFloat($('capGib').value)       || 260;
  const credExpiry   = parseInt($('credExpiry').value, 10) || 28800;
  const verifyCount  = parseInt($('verifyChunks').value, 10) || 0;

  if (!adminKey) { emit('Admin key is required.', 'err'); return; }

  const CHUNK_SIZE   = chunkMib * 1024 * 1024;
  const totalBytes   = Math.round(targetGib * 1024 * 1024 * 1024);
  const totalChunks  = Math.ceil(totalBytes / CHUNK_SIZE);
  const capBytes     = Math.round(capGib * 1024 * 1024 * 1024);
  const URL_BATCH    = 256; // Worker returns 256 presigned URLs per /urls call

  emit(`▶  Starting soak upload`, 'head');
  emit(`   Target       : ${fmtBytes(totalBytes)} — ${totalChunks} chunks × ${fmtBytes(CHUNK_SIZE)}`, 'info');
  emit(`   Concurrency  : ${concurrency} parallel PUTs`, 'info');
  emit(`   Worker       : ${workerUrl}`, 'info');
  emit(`   listBasedCompleteness pages needed: ${Math.ceil(totalChunks / 1000)}`, 'info');

  $('btnStart').disabled = true;
  $('btnAbort').disabled = false;
  abortController = new AbortController();
  const { signal } = abortController;

  const tStart       = Date.now();
  let chunksUploaded = 0;
  let bytesUploaded  = 0;
  let hadError       = false;

  // Shared state for parallel uploader
  const chunkHashes = new Array(totalChunks); // filled by index as chunks complete
  // URL batch cache — keyed by batch start chunk index
  const urlCache       = {};     // batchStart → [{index, url, expires}]
  const batchFetching  = {};     // batchStart → Promise<void>
  let   sessionToken   = null;
  let   uuid           = null;

  // Fetch a URL batch from /upload/:uuid/urls
  async function fetchBatch(batchStart) {
    if (batchStart in urlCache) return;
    if (!(batchStart in batchFetching)) {
      batchFetching[batchStart] = (async () => {
        const res = await fetch(`${workerUrl}/upload/${uuid}/urls`, {
          method: 'POST',
          signal,
          headers: {
            'Content-Type':     'application/json',
            'X-Upload-Session': sessionToken,
          },
          body: JSON.stringify({ from: batchStart, count: 256 }),
        });
        if (!res.ok) throw new Error(`/urls batch ${batchStart} → ${res.status}`);
        const d = await res.json();
        urlCache[batchStart] = d.urls;
      })();
    }
    await batchFetching[batchStart];
  }

  async function getUrl(i) {
    const batchStart = Math.floor(i / URL_BATCH) * URL_BATCH;
    await fetchBatch(batchStart);
    // Pre-fetch next batch in background
    const next = batchStart + URL_BATCH;
    if (next < totalChunks && !(next in urlCache) && !(next in batchFetching))
      fetchBatch(next).catch(() => {}); // fire-and-forget; will retry on demand
    return urlCache[batchStart][i - batchStart].url;
  }

  function updateStats() {
    const elapsed = Math.round((Date.now() - tStart) / 1000) || 1;
    const pct     = Math.round((chunksUploaded / totalChunks) * 100);
    const speed   = bytesUploaded / elapsed; // bytes/s
    const remaining = totalBytes - bytesUploaded;
    const eta     = speed > 0 ? Math.round(remaining / speed) : 0;

    $('prog').value            = pct;
    $('statChunks').textContent  = `${chunksUploaded} / ${totalChunks}`;
    $('statBytes').textContent   = fmtBytes(bytesUploaded);
    $('statElapsed').textContent = fmtSeconds(elapsed);
    $('statSpeed').textContent   = `${fmtBytes(speed)}/s`;
    $('statEta').textContent     = eta > 0 ? fmtSeconds(eta) : '—';
  }

  try {
    // ── Step 1: request test credential ──────────────────────────────────────
    emit('\n[1/5] Requesting test credential…', 'head');

    const { blinded_message } = await blindedMessage();

    const credRes = await fetch(`${workerUrl}/admin/test-credential`, {
      method: 'POST',
      signal,
      headers: { 'Content-Type': 'application/json', 'X-Admin-Key': adminKey },
      body: JSON.stringify({
        blinded_message,
        cap_bytes:          capBytes,
        expires_in_seconds: credExpiry,
      }),
    });

    if (!credRes.ok) { emit(`Error ${credRes.status}: ${await credRes.text()}`, 'err'); return; }

    const cred = await credRes.json();
    ({ uuid } = cred);
    const { issued_tier, commitment, allocation_bytes, signed_point, mint_pubkey } = cred;

    emit(`   UUID         : ${uuid}`, 'ok');
    emit(`   Issued tier  : ${issued_tier}`, 'ok');
    emit(`   Allocation   : ${fmtBytes(allocation_bytes)}`, 'ok');
    $('statUuid').textContent = uuid;

    const cashuCredential = JSON.stringify({ C_: signed_point, mint_pubkey });

    // ── Step 2: initiate ──────────────────────────────────────────────────────
    emit('\n[2/5] Initiating transfer…', 'head');

    const expiryTs = Math.floor(Date.now() / 1000) + 90 * 24 * 3600;

    const initiateRes = await fetch(`${workerUrl}/upload/${uuid}/initiate`, {
      method: 'POST',
      signal,
      headers: {
        'Content-Type':            'application/json',
        'X-Cashu-Credential':      cashuCredential,
        'X-Total-Chunks':          String(totalChunks),
        'X-Total-Bytes':           String(totalBytes),
        'X-Expiry-Timestamp':      String(expiryTs),
        'X-Credential-Commitment': commitment,
        'X-Issued-Tier':           issued_tier,
        'X-File-Name':             'soak-test-payload',
      },
    });

    if (!initiateRes.ok) { emit(`Error ${initiateRes.status}: ${await initiateRes.text()}`, 'err'); return; }

    const initData = await initiateRes.json();
    sessionToken = initData.session_token;
    urlCache[0]  = initData.urls; // seed batch 0
    emit(`   Session token obtained. Batch 0: ${initData.urls.length} URLs.`, 'ok');

    // ── Step 3: parallel upload ───────────────────────────────────────────────
    emit(`\n[3/5] Uploading ${totalChunks} chunks with concurrency=${concurrency}…`, 'head');

    // Track chunk progress for periodic log lines
    let lastLogChunk = 0;

    async function uploadOneChunk(i) {
      if (signal.aborted) throw new Error('Aborted');
      if (hadError)        return; // another worker failed; bail

      const isLast     = i === totalChunks - 1;
      const chunkBytes = isLast ? (totalBytes - i * CHUNK_SIZE) : CHUNK_SIZE;

      // Generate payload and compute hash in parallel with URL fetch
      const payload = randomChunk(chunkBytes);
      const [hashBytes, presignedUrl] = await Promise.all([
        Promise.resolve(blake3(payload)), // synchronous, wrapped for .all
        getUrl(i),
      ]);

      chunkHashes[i] = toB64url(hashBytes);

      // PUT with up to 3 retries
      let putRes;
      for (let attempt = 0; attempt < 3; attempt++) {
        putRes = await fetch(presignedUrl, {
          method: 'PUT',
          signal,
          headers: { 'Content-Type': 'application/octet-stream' },
          body: payload,
        });
        if (putRes.ok || putRes.status < 500) break;
        const body = await putRes.text();
        console.warn(`PUT chunk ${i} attempt ${attempt+1} → ${putRes.status}`, body);
        emit(`   ⚠ chunk ${i} attempt ${attempt+1} → ${putRes.status} — retrying…`, 'warn');
        await new Promise(r => setTimeout(r, 2000 * (attempt + 1)));
      }

      if (!putRes.ok) {
        const errText = await putRes.text().catch(() => '');
        emit(`✗ PUT chunk ${i} → ${putRes.status}: ${errText.slice(0, 200)}`, 'err');
        hadError = true;
        return;
      }

      chunksUploaded++;
      bytesUploaded += chunkBytes;

      // Log every 100 chunks
      if (chunksUploaded - lastLogChunk >= 100 || chunksUploaded === totalChunks) {
        lastLogChunk = chunksUploaded;
        updateStats();
        const elapsed = Math.round((Date.now() - tStart) / 1000);
        emit(`   ${chunksUploaded}/${totalChunks} chunks — ${fmtBytes(bytesUploaded)} in ${fmtSeconds(elapsed)}`, 'info');
      }
    }

    // Worker pool: N concurrent workers each pulling the next chunk index
    let nextChunk = 0;
    async function worker() {
      while (true) {
        const i = nextChunk++;
        if (i >= totalChunks) break;
        await uploadOneChunk(i);
        if (hadError || signal.aborted) break;
      }
    }

    await Promise.all(Array.from({ length: concurrency }, () => worker()));

    if (signal.aborted) throw new Error('Aborted by user');
    if (hadError) throw new Error('Upload failed — see log above');
    if (chunkHashes.some(h => !h)) throw new Error('Internal: missing chunk hashes after upload');

    updateStats();
    emit(`   All ${totalChunks} chunks uploaded.`, 'ok');

    // ── Step 4: compute merkle root ───────────────────────────────────────────
    emit('\n[4/5] Computing merkle root…', 'head');

    const leafBytes = chunkHashes.map(h => b64urlDecode(h));
    const rootBytes = buildMerkleRoot(leafBytes);
    const merkleRoot = toB64url(rootBytes);
    emit(`   Root: ${merkleRoot}`, 'ok');

    // ── Step 5: finalise ──────────────────────────────────────────────────────
    emit('\n[5/5] Finalising (listBasedCompleteness will page ' +
         `${Math.ceil(totalChunks / 1000)} × list(limit:1000))…`, 'head');

    const finaliseRes = await fetch(`${workerUrl}/upload/${uuid}/finalise`, {
      method: 'POST',
      signal,
      headers: { 'Content-Type': 'application/json', 'X-Upload-Session': sessionToken },
      body: JSON.stringify({ hashes: chunkHashes, merkle_root: merkleRoot }),
    });

    if (!finaliseRes.ok) {
      emit(`Finalise error ${finaliseRes.status}: ${await finaliseRes.text()}`, 'err');
      return;
    }

    const finaliseData = await finaliseRes.json();
    const elapsed = Math.round((Date.now() - tStart) / 1000);
    emit(`   Finalise OK — ${JSON.stringify(finaliseData)}`, 'ok');
    emit(`\n✓ Upload soak complete. ${fmtBytes(totalBytes)} in ${fmtSeconds(elapsed)}.`, 'ok');
    emit(`  Transfer UUID : ${uuid}`, 'ok');
    emit(`  Merkle root   : ${merkleRoot}`, 'ok');
    $('prog').value = 100;

    // ── Step 6 (optional): download-verify phase ──────────────────────────────
    if (verifyCount > 0) {
      emit(`\n[6/6] Download-verify phase — ${verifyCount} chunks (WASM BLAKE3 on Worker)…`, 'head');
      emit('   Transfer has ' + totalChunks + ' chunks → ' +
           (totalChunks > 128 ? 'streaming verify path (>128 threshold)' : 'inline verify path (≤128 threshold)'), 'info');

      // Pick evenly-spaced chunk indices across the transfer
      const verifyIndices = [];
      if (verifyCount >= totalChunks) {
        for (let i = 0; i < totalChunks; i++) verifyIndices.push(i);
      } else {
        const step = Math.floor(totalChunks / verifyCount);
        for (let i = 0; i < verifyCount; i++) verifyIndices.push(Math.min(i * step, totalChunks - 1));
      }

      let dlOk = 0, dlFail = 0;

      for (const ci of verifyIndices) {
        if (signal.aborted) break;
        const chunkKey = String(ci).padStart(4, '0');
        const dlUrl    = `${workerUrl}/download/${uuid}/${chunkKey}`;
        emit(`   → GET /download/${uuid}/${chunkKey}…`, 'info');

        try {
          const dlRes = await fetch(dlUrl, { signal });
          const integrity = dlRes.headers.get('X-Integrity') ?? '(absent)';
          const chunkIdx  = dlRes.headers.get('X-Chunk-Index') ?? '?';

          if (!dlRes.ok) {
            emit(`   ✗ chunk ${ci}: HTTP ${dlRes.status}`, 'err');
            dlFail++;
            await dlRes.body?.cancel();
            continue;
          }

          // Drain the response body — for >128 chunks (streaming path) this is
          // required to confirm the WASM BLAKE3 hash matched at end-of-stream.
          // A truncated connection (hash mismatch) surfaces as a body read error.
          try {
            const reader = dlRes.body.getReader();
            let totalDl  = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              totalDl += value.length;
            }
            if (integrity === 'ciphertext-storage-verified') {
              emit(`   ✓ chunk ${ci}: ${fmtBytes(totalDl)} · X-Integrity=${integrity} · X-Chunk-Index=${chunkIdx}`, 'ok');
              dlOk++;
            } else {
              emit(`   ⚠ chunk ${ci}: ${fmtBytes(totalDl)} · X-Integrity=${integrity} (expected ciphertext-storage-verified)`, 'warn');
              dlFail++;
            }
          } catch (bodyErr) {
            emit(`   ✗ chunk ${ci}: body read failed (possible BLAKE3 mismatch / stream truncated): ${bodyErr.message}`, 'err');
            dlFail++;
          }
        } catch (fetchErr) {
          if (fetchErr.name === 'AbortError') throw fetchErr;
          emit(`   ✗ chunk ${ci}: ${fetchErr.message}`, 'err');
          dlFail++;
        }
      }

      if (dlFail === 0) {
        emit(`\n✓ Download-verify: ${dlOk}/${verifyCount} chunks passed. WASM BLAKE3 soak: GREEN.`, 'ok');
      } else {
        emit(`\n⚠ Download-verify: ${dlOk} pass, ${dlFail} fail. Check log above.`, 'err');
      }
    }

    emit('\n─── Soak complete ───', 'head');
    emit(`UUID: ${uuid}`, 'info');
    emit(`Merkle root: ${merkleRoot}`, 'info');

  } catch (e) {
    if (e.name === 'AbortError' || e.message === 'Aborted by user') {
      emit('\n⚠ Aborted.', 'err');
    } else {
      emit(`\n✗ Unexpected error: ${e.message}`, 'err');
      console.error(e);
    }
  } finally {
    $('btnStart').disabled = false;
    $('btnAbort').disabled = true;
    abortController = null;
  }
});

$('btnAbort').addEventListener('click', () => {
  if (abortController) { abortController.abort(); emit('Abort requested…', 'warn'); }
});
</script>
</body>
</html>
